<section class="mx-auto max-w-md px-5 py-20 text-center">
  @switch (state()) {
    @case ('verifying') {
      <p class="font-(family-name:--font-mono) text-sm text-(--color-muted)">Verifying your email…</p>
    }
    @case ('success') {
      <h1 class="text-2xl font-bold text-(--color-ink)">Email verified</h1>
      <p class="mt-3 text-(--color-muted)">You can now sign in to your account.</p>
      <a
        routerLink="/login"
        class="mt-6 inline-block rounded-full bg-(--color-teal) px-6 py-3 text-sm font-semibold text-(--color-surface) hover:opacity-90"
        >Go to sign in</a
      >
    }
    @case ('error') {
      <h1 class="text-2xl font-bold text-(--color-ink)">This link didn't work</h1>
      <p class="mt-3 text-(--color-muted)">{{ errorMessage() }}</p>
      <a routerLink="/login" class="mt-6 inline-block text-sm font-semibold text-(--color-teal) hover:underline"
        >Back to sign in</a
      >
    }
  }
</section>
