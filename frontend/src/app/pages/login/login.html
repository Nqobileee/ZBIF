<section class="mx-auto max-w-md px-5 py-16">
  <p class="font-(family-name:--font-mono) text-xs font-semibold uppercase tracking-[0.14em] text-(--color-teal)">
    Welcome back
  </p>
  <h1 class="mt-3 text-3xl font-bold tracking-tight text-(--color-ink)">Sign in</h1>

  <form class="mt-8 flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="email" class="block text-sm font-medium text-(--color-ink)">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="mt-1.5 w-full rounded-md border border-(--color-rule) bg-(--color-surface) px-3.5 py-2.5 text-sm text-(--color-ink) outline-none focus:border-(--color-teal)"
      />
    </div>

    <div>
      <div class="flex items-baseline justify-between">
        <label for="password" class="block text-sm font-medium text-(--color-ink)">Password</label>
        <a routerLink="/forgot-password" class="text-xs font-medium text-(--color-teal) hover:underline">Forgot?</a>
      </div>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="mt-1.5 w-full rounded-md border border-(--color-rule) bg-(--color-surface) px-3.5 py-2.5 text-sm text-(--color-ink) outline-none focus:border-(--color-teal)"
      />
    </div>

    @if (errorMessage(); as message) {
      <p class="rounded-md border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm text-red-700">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="rounded-full bg-(--color-teal) px-6 py-3 text-sm font-semibold text-(--color-surface) transition hover:opacity-90 disabled:opacity-60"
    >
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-(--color-muted)">
    New to ZBIF? <a routerLink="/register" class="font-medium text-(--color-teal) hover:underline">Create an account</a>
  </p>
</section>
